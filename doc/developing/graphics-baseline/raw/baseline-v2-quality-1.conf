# Optional quality preset. Copy these settings into minetest.conf or launch with:
#   ./bin/luanti --config misc/graphics-quality.conf
# Restart the client after changing pipeline effects.
# Shadows and volumetric strength also depend on the game's set_lighting API.
enable_post_processing = true
enable_ssao = true
enable_ssao_emission_mask = true
ssao_radius = 0.75
ssao_strength = 1.0
enable_dynamic_shadows = true
shadow_map_texture_size = 2048
shadow_filters = 2
enable_contact_hardening_shadows = true
shadow_light_angle = 0.53
shadow_blocker_search_distance = 64
shadow_map_color = true
enable_bloom = true
enable_volumetric_lighting = false
enable_auto_exposure = true
tone_mapping = true
enable_waving_water = true
enable_water_reflections = true
enable_waving_leaves = true
enable_waving_plants = true
enable_translucent_foliage = true
leaves_style = fancy
fxaa = false
post_processing_texture_bits = 16
enable_atmosphere = true
enable_volumetric_clouds = true
enable_cloud_denoising = true
cloud_history_weight = 0.9
enable_cloud_shadows = true
cloud_shadow_strength = 0.75
cloud_shadow_resolution = 256
cloud_shadow_distance = 256
volumetric_cloud_samples = 32
volumetric_cloud_distance = 1024
volumetric_cloud_resolution = 0.5
volumetric_cloud_density = 0.18
volumetric_cloud_detail = 0.35
atmosphere_density = 0.003
enable_volumetric_fog = true
enable_fog_denoising = true
fog_history_weight = 0.9
fog_resolution = 0.5
volumetric_fog_distance = 128
volumetric_fog_height = 64
volumetric_fog_variation = 0.35
volumetric_fog_steps = 24
enable_screen_space_reflections = true
water_reflection_strength = 0.8
enable_water_refraction = true
enable_water_volume = true
water_volume_size = 48
water_caustics_strength = 0.7
enable_voxel_water_lighting = true
voxel_water_strength = 0.5
voxel_water_anisotropy = 0.5
voxel_water_steps = 8
water_absorption_strength = 1.0
water_refraction_distance = 32
water_refraction_strength = 1.0
enable_material_shading = true
material_roughness = 0.8
material_normal_strength = 0.2
material_map_normal_strength = 1.0
enable_indirect_lighting = false
indirect_light_strength = 0.35
indirect_light_radius = 3.0
antialiasing = taa
taa_history_weight = 0.9
enable_camera_vignette = true
camera_vignette_strength = 0.2
enable_camera_motion_blur = true
camera_motion_blur_strength = 0.35
camera_motion_blur_max = 24
camera_motion_blur_samples = 12
# Manual depth of field is available for cinematic scenes.
enable_camera_dof = false
camera_dof_focus_distance = 8
camera_dof_focus_range = 2
camera_dof_blur = 6
enable_voxel_lighting = true
enable_voxel_dynamic_lighting = true
enable_voxel_dynamic_direct = true
enable_voxel_transmission = true
enable_voxel_fog_lighting = true
voxel_fog_strength = 0.5
voxel_fog_anisotropy = 0.35
voxel_lighting_size = 32
voxel_gi_bounces = 2
voxel_light_strength = 1.0
voxel_gi_strength = 0.5

video_driver = opengl3
3d_mode = none
screen_w = 1920
screen_h = 1080
fullscreen = true
window_maximized = false
vsync = false
fps_max = 1000
fps_max_unfocused = 1000
pause_on_lost_focus = false
viewing_range = 96
fov = 70
mip_map = true
trilinear_filter = true
bilinear_filter = true
anisotropic_filter = false
enable_sound = false
enable_damage = false
creative_mode = true
time_speed = 0
liquid_update = 1000
active_block_range = 1
mcl_mobspawning = false
mcl_weather = false
mobs_spawn = false
mcl_doWeatherCycle = false
show_debug = false
profiler_print_interval = 0

benchmark_frame_log = /tmp/luanti-milestone1/baseline-v2-quality-1/frames.csv
graphics_benchmark_warmup = 20.0
graphics_benchmark_duration = 20.0
vl_creative_instant_kill = true
mcl_enable_hunger = true
name = GraphicsBench

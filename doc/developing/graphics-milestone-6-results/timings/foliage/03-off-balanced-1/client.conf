# Semi-realistic baseline preset. See doc/developing/graphics-milestone-1.md.
# Outdoor 1080p/60 FPS remains a measured budget target, not a guarantee.
enable_post_processing = true
post_processing_texture_bits = 16
enable_dynamic_shadows = true
shadow_map_texture_size = 1024
shadow_filters = 1
enable_contact_hardening_shadows = true
shadow_light_angle = 0.53
shadow_blocker_search_distance = 32
shadow_map_color = true
enable_ssao = true
enable_ssao_emission_mask = true
ssao_radius = 0.6
ssao_strength = 0.7
enable_bloom = true
enable_auto_exposure = true
auto_exposure_speed_dark_bright = 3.0
auto_exposure_speed_bright_dark = 1.0
tone_mapping = true
enable_atmosphere = true
atmosphere_density = 0.002
enable_volumetric_clouds = false
enable_cloud_shadows = false
# Volumetric fog/clouds and caustics remain optional quality effects.
enable_volumetric_fog = false
enable_fog_denoising = true
fog_resolution = 0.5
volumetric_fog_steps = 8
volumetric_fog_distance = 64
volumetric_fog_height = 64
volumetric_fog_variation = 0.2
enable_voxel_fog_lighting = false
enable_waving_water = true
enable_waving_leaves = true
enable_waving_plants = true
enable_translucent_foliage = false
leaves_style = fancy
enable_water_reflections = true
enable_screen_space_reflections = true
water_reflection_strength = 0.7
enable_water_refraction = true
enable_water_volume = true
water_volume_size = 32
water_refraction_distance = 16
water_refraction_strength = 0.7
water_absorption_strength = 1.0
water_caustics_strength = 0.0
enable_voxel_water_lighting = false
enable_material_shading = true
enable_material_sparkle = true
material_roughness = 0.8
material_normal_strength = 0.15
material_map_normal_strength = 1.0
enable_indirect_lighting = false
enable_voxel_lighting = true
enable_voxel_dynamic_lighting = true
enable_voxel_dynamic_direct = true
enable_voxel_transmission = true
voxel_lighting_size = 32
voxel_gi_bounces = 1
voxel_light_strength = 1.0
voxel_light_soft_falloff = true
voxel_gi_strength = 0.35
antialiasing = taa
taa_history_weight = 0.9
enable_camera_vignette = true
camera_vignette_strength = 0.12
enable_camera_motion_blur = false
enable_camera_dof = false

video_driver = opengl3
